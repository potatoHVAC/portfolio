name: Portfolio CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-metadata:
    name: media-metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install metadata tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends file jq libimage-exiftool-perl

      - name: Check image metadata
        run: tools/media/check-metadata.sh

  container:
    name: container-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --platform linux/arm64 --tag portfolio:ci .

      - name: Smoke-test image
        run: bin/smoke.sh portfolio:ci

      - name: Verify architecture
        run: docker image inspect portfolio:ci --format "{{.Architecture}}" | grep --fixed-strings --line-regexp arm64
