name: Portfolio CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruby-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby
        run: bundle exec rubocop

  media:
    name: media-ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run media gates
        run: bin/media ci

  # Building, testing, smoke-checking and publishing the image is the shared
  # pipeline's job. What stays here is what is specific to this repository: the
  # image's inputs, and what to do with the digest afterwards.
  #
  # production_target is deliberately unset. That builds the Dockerfile's final
  # stage, which asserts prod is last — a build that forgets --target cannot
  # then publish an image carrying the test suite.
  container:
    name: container
    needs:
      - lint
      - media
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: portfolio-container-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    uses: potatoHVAC/speerd-devops/.github/workflows/container-ci.yml@container-ci/v1
    with:
      name: portfolio
      context: .
      platform: linux/arm64
      runner: ubuntu-24.04-arm
      test_target: test
      test_command: '["/rails/bin/rails","test"]'
      # Lambda runs this image with a read-only root and a writable /tmp, so
      # both checks run that way too. bin/smoke asserts it rather than trusting
      # the flags arrived.
      test_run_args: >-
        ["--read-only",
         "--tmpfs","/tmp:rw,noexec,nosuid,size=64m,mode=1777",
         "--tmpfs","/rails/log:rw,noexec,nosuid,size=16m,mode=1777",
         "--tmpfs","/rails/tmp:rw,noexec,nosuid,size=64m,mode=1777",
         "--env","CI=true",
         "--env","HOME=/tmp"]
      smoke_command: '["/rails/bin/smoke"]'
      smoke_run_args: >-
        ["--read-only",
         "--tmpfs","/tmp:rw,noexec,nosuid,size=64m"]
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      aws_region: ${{ vars.AWS_REGION }}
      registry_repository: dev/portfolio
      image_tag: git-${{ github.sha }}
      mutable_tag: main
    secrets:
      aws_role_arn: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}

  deploy:
    name: deploy-dev
    needs: container
    if: needs.container.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # actions: read is for bin/promotion-candidates, which lists this
      # workflow's successful runs to decide what is promotable.
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_CI_ROLE_ARN: ${{ secrets.AWS_CI_ROLE_ARN }}
      AWS_DEV_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
      DEV_ECR_REPOSITORY: dev/portfolio
      DEV_IMAGE_DIGEST: ${{ needs.container.outputs.digest }}
      DEV_FUNCTION_NAME: portfolio-dev
      DEV_ALIAS: live
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mask the AWS account ID
        run: echo "::add-mask::${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Configure dev deploy AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEV_DEPLOY_ROLE_ARN }}
          role-session-name: portfolio-dev-deploy-${{ github.run_id }}

      # The shared workflow returns the digest but not the registry host: the
      # host carries the account ID, which is masked, and GitHub drops job
      # outputs containing masked values. Resolving it here costs one call.
      - name: Resolve the published image URI
        id: image
        run: |
          set -euo pipefail
          [[ "$DEV_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid digest from the container workflow: $DEV_IMAGE_DIGEST"
            exit 1
          }
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          echo "uri=$registry/$DEV_ECR_REPOSITORY@$DEV_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy the published image to dev
        id: deploy
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          # Publishing succeeds on its own before the environment exists.
          if ! aws lambda get-function \
            --function-name "$DEV_FUNCTION_NAME" >/dev/null 2>&1; then
            echo "$DEV_FUNCTION_NAME does not exist; image published, nothing deployed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          live_uri=$(aws lambda get-function \
            --function-name "$DEV_FUNCTION_NAME" \
            --qualifier "$DEV_ALIAS" \
            --query 'Code.ResolvedImageUri' --output text)

          if [ "$live_uri" = "$IMAGE_URI" ]; then
            echo "$DEV_ALIAS already runs $IMAGE_URI"
            version=$(aws lambda get-alias \
              --function-name "$DEV_FUNCTION_NAME" \
              --name "$DEV_ALIAS" \
              --query FunctionVersion --output text)
            {
              echo "deployed=false"
              echo "version=$version"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(aws lambda get-alias \
            --function-name "$DEV_FUNCTION_NAME" \
            --name "$DEV_ALIAS" \
            --query FunctionVersion --output text)

          aws lambda update-function-code \
            --function-name "$DEV_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated-v2 \
            --function-name "$DEV_FUNCTION_NAME"

          # Publishing freezes the code; moving the alias is what makes it live.
          version=$(aws lambda publish-version \
            --function-name "$DEV_FUNCTION_NAME" \
            --description "$GITHUB_SHA" \
            --query Version --output text)
          aws lambda update-alias \
            --function-name "$DEV_FUNCTION_NAME" \
            --name "$DEV_ALIAS" \
            --function-version "$version" >/dev/null

          deployed_uri=$(aws lambda get-function \
            --function-name "$DEV_FUNCTION_NAME" \
            --qualifier "$DEV_ALIAS" \
            --query 'Code.ResolvedImageUri' --output text)
          test "$deployed_uri" = "$IMAGE_URI" || {
            echo "$DEV_ALIAS resolved to $deployed_uri, not $IMAGE_URI"
            exit 1
          }

          {
            echo "deployed=true"
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      - name: Verify public media delivery
        run: bin/media verify-manifest --remote https://speerd.com

      - name: Write job summary
        if: always()
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          VERSION: ${{ steps.deploy.outputs.version }}
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: |
          {
            echo '## Portfolio dev deploy'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Commit tag: \`git-$GITHUB_SHA\`"
            echo "- Digest: \`$DEV_IMAGE_DIGEST\`"
            echo "- URI: \`$IMAGE_URI\`"
            if [ "$DEPLOYED" = true ]; then
              echo "- Deployed: alias \`$DEV_ALIAS\` now on version \`$VERSION\`"
              echo "- Roll back: \`aws lambda update-alias --function-name $DEV_FUNCTION_NAME --name $DEV_ALIAS --function-version $PREVIOUS\`"
            elif [ -n "$VERSION" ]; then
              echo "- Deployed: no change; alias \`$DEV_ALIAS\` already on version \`$VERSION\`"
            else
              echo "- Deployed: nothing; the dev function does not exist yet"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Informational and non-blocking. By this point every delivery check has
      # passed; include this run even though GitHub marks it successful only
      # after the job exits.
      - name: Configure read-only deployment state credentials
        id: catalog_credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          role-session-name: portfolio-state-${{ github.run_id }}

      - name: List what can now be promoted
        if: steps.catalog_credentials.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_CURRENT_COMMIT: ${{ github.sha }}
          PROD_ECR_REPOSITORY: prod/portfolio
          PROD_FUNCTION_NAME: portfolio-prod
        run: |
          bin/promotion-candidates
          cat "$RUNNER_TEMP/promotion-candidates.md" >> "$GITHUB_STEP_SUMMARY"
