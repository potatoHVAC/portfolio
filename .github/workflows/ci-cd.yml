name: Portfolio CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruby-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint Ruby
        run: bundle exec rubocop

  test:
    name: rails-test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Rails tests
        run: bin/rails test

  media:
    name: media-ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run media gates
        run: bin/media ci

  container:
    name: container-arm64
    needs:
      - lint
      - test
      - media
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: portfolio-container-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'push' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEV_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
      IMAGE_NAME: portfolio:ci-${{ github.sha }}
      DEV_ECR_REPOSITORY: dev/portfolio
      DEV_IMAGE_TAG: git-${{ github.sha }}
      DEV_MUTABLE_TAG: main
      DEV_FUNCTION_NAME: portfolio-dev
      DEV_ALIAS: live
    steps:
      - name: Decide whether this run publishes
        id: publish
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            echo 'Push to main: this run publishes to dev.'
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_EVENT_NAME on $GITHUB_REF: validation only, nothing is published."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check dev publish configuration
        if: steps.publish.outputs.enabled == 'true'
        run: |
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION repository variable'; exit 1; }
          test -n "$AWS_DEV_DEPLOY_ROLE_ARN" || { echo 'Missing AWS_DEV_DEPLOY_ROLE_ARN repository secret'; exit 1; }

      - name: Build image
        run: docker build --platform linux/arm64 --tag "$IMAGE_NAME" .

      - name: Smoke-test image
        run: bin/smoke.sh "$IMAGE_NAME"

      - name: Verify architecture
        run: docker image inspect "$IMAGE_NAME" --format "{{.Architecture}}" | grep --fixed-strings --line-regexp arm64

      - name: Mask the AWS account ID
        if: steps.publish.outputs.enabled == 'true'
        run: echo "::add-mask::${{ secrets.AWS_ACCOUNT_ID }}"

      - name: Configure dev deploy AWS credentials
        if: steps.publish.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEV_DEPLOY_ROLE_ARN }}
          role-session-name: portfolio-dev-publish-${{ github.run_id }}

      - name: Publish the validated image to dev
        id: image
        if: steps.publish.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          repository="$registry/$DEV_ECR_REPOSITORY"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          docker tag "$IMAGE_NAME" "$repository:$DEV_IMAGE_TAG"

          commit_image=$(aws ecr batch-get-image \
            --repository-name "$DEV_ECR_REPOSITORY" \
            --image-ids imageTag="$DEV_IMAGE_TAG" \
            --output json)
          image_digest=$(printf '%s' "$commit_image" | jq -r '.images[0].imageId.imageDigest // empty')
          if [ -z "$image_digest" ]; then
            failure=$(printf '%s' "$commit_image" | jq -r '.failures[0].failureCode // empty')
            test "$failure" = ImageNotFound || {
              echo "Could not resolve $DEV_IMAGE_TAG: ${failure:-unknown error}"
              exit 1
            }
            docker push "$repository:$DEV_IMAGE_TAG"
            commit_image=$(aws ecr batch-get-image \
              --repository-name "$DEV_ECR_REPOSITORY" \
              --image-ids imageTag="$DEV_IMAGE_TAG" \
              --output json)
            image_digest=$(printf '%s' "$commit_image" | jq -r '.images[0].imageId.imageDigest // empty')
          else
            echo "$DEV_IMAGE_TAG already exists at $image_digest"
          fi
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid ECR digest: $image_digest"
            exit 1
          }

          image_manifest=$(printf '%s' "$commit_image" | jq -r '.images[0].imageManifest // empty')
          test -n "$image_manifest" || { echo "Missing manifest for $DEV_IMAGE_TAG"; exit 1; }
          main_image=$(aws ecr batch-get-image \
            --repository-name "$DEV_ECR_REPOSITORY" \
            --image-ids imageTag="$DEV_MUTABLE_TAG" \
            --output json)
          main_digest=$(printf '%s' "$main_image" | jq -r '.images[0].imageId.imageDigest // empty')
          if [ -z "$main_digest" ]; then
            failure=$(printf '%s' "$main_image" | jq -r '.failures[0].failureCode // empty')
            test "$failure" = ImageNotFound || {
              echo "Could not resolve $DEV_MUTABLE_TAG: ${failure:-unknown error}"
              exit 1
            }
          fi
          if [ "$main_digest" != "$image_digest" ]; then
            published=$(aws ecr put-image \
              --repository-name "$DEV_ECR_REPOSITORY" \
              --image-tag "$DEV_MUTABLE_TAG" \
              --image-manifest "$image_manifest" \
              --output json)
            main_digest=$(printf '%s' "$published" | jq -r '.image.imageId.imageDigest // empty')
            test "$main_digest" = "$image_digest" || {
              echo "$DEV_MUTABLE_TAG resolved to $main_digest, not $image_digest"
              exit 1
            }
          else
            echo "$DEV_MUTABLE_TAG already points at $image_digest"
          fi

          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "uri=$repository@$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy the published image to dev
        id: deploy
        if: steps.publish.outputs.enabled == 'true'
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          set -euo pipefail

          # Publishing succeeds on its own before the environment exists.
          if ! aws lambda get-function \
            --function-name "$DEV_FUNCTION_NAME" >/dev/null 2>&1; then
            echo "$DEV_FUNCTION_NAME does not exist; image published, nothing deployed."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          live_uri=$(aws lambda get-function \
            --function-name "$DEV_FUNCTION_NAME" \
            --qualifier "$DEV_ALIAS" \
            --query 'Code.ResolvedImageUri' --output text)

          if [ "$live_uri" = "$IMAGE_URI" ]; then
            echo "$DEV_ALIAS already runs $IMAGE_URI"
            version=$(aws lambda get-alias \
              --function-name "$DEV_FUNCTION_NAME" \
              --name "$DEV_ALIAS" \
              --query FunctionVersion --output text)
            {
              echo "deployed=false"
              echo "version=$version"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(aws lambda get-alias \
            --function-name "$DEV_FUNCTION_NAME" \
            --name "$DEV_ALIAS" \
            --query FunctionVersion --output text)

          aws lambda update-function-code \
            --function-name "$DEV_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated-v2 \
            --function-name "$DEV_FUNCTION_NAME"

          # Publishing freezes the code; moving the alias is what makes it live.
          version=$(aws lambda publish-version \
            --function-name "$DEV_FUNCTION_NAME" \
            --description "$GITHUB_SHA" \
            --query Version --output text)
          aws lambda update-alias \
            --function-name "$DEV_FUNCTION_NAME" \
            --name "$DEV_ALIAS" \
            --function-version "$version" >/dev/null

          deployed_uri=$(aws lambda get-function \
            --function-name "$DEV_FUNCTION_NAME" \
            --qualifier "$DEV_ALIAS" \
            --query 'Code.ResolvedImageUri' --output text)
          test "$deployed_uri" = "$IMAGE_URI" || {
            echo "$DEV_ALIAS resolved to $deployed_uri, not $IMAGE_URI"
            exit 1
          }

          {
            echo "deployed=true"
            echo "version=$version"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

      - name: Verify public media delivery
        if: steps.publish.outputs.enabled == 'true'
        run: bin/media verify-manifest --remote https://speerd.com

      - name: Write job summary
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.enabled }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed }}
          VERSION: ${{ steps.deploy.outputs.version }}
          PREVIOUS: ${{ steps.deploy.outputs.previous }}
        run: |
          {
            echo '## Portfolio image'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Platform: \`linux/arm64\`"
            if [ "$PUBLISHED" = true ]; then
              echo '- Result: built, smoke-tested, and published to dev'
              echo "- Commit tag: \`$DEV_IMAGE_TAG\`"
              echo "- Mutable tag: \`$DEV_MUTABLE_TAG\`"
              echo "- Digest: \`$IMAGE_DIGEST\`"
              echo "- URI: \`$IMAGE_URI\`"
              if [ "$DEPLOYED" = true ]; then
                echo "- Deployed: alias \`$DEV_ALIAS\` now on version \`$VERSION\`"
                echo "- Roll back: \`aws lambda update-alias --function-name $DEV_FUNCTION_NAME --name $DEV_ALIAS --function-version $PREVIOUS\`"
              elif [ -n "$VERSION" ]; then
                echo "- Deployed: no change; alias \`$DEV_ALIAS\` already on version \`$VERSION\`"
              else
                echo "- Deployed: nothing; the dev function does not exist yet"
              fi
            else
              echo '- Result: built and smoke-tested; nothing published'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
