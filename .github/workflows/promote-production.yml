name: Promote to PROD
run-name: ${{ inputs.action == 'specific' && format('Promote to PROD - specific {0}', inputs.commit) || format('Promote to PROD - {0}', inputs.action) }}

on:
  workflow_dispatch:
    inputs:
      action:
        description: "list shows candidates and deploys nothing; latest promotes the newest proven build; specific promotes the commit below"
        required: true
        default: list
        type: choice
        options:
          - list
          - latest
          - specific
      commit:
        description: "Commit SHA to promote. Read only when action is 'specific'."
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: portfolio-deploy-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PROD_DEPLOY_ROLE_ARN: ${{ secrets.AWS_PROD_DEPLOY_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      DEV_ECR_REPOSITORY: dev/portfolio
      PROD_ECR_REPOSITORY: prod/portfolio
      PROD_FUNCTION_NAME: portfolio-prod
    steps:
      - name: Decide what this run does
        id: mode
        env:
          ACTION: ${{ inputs.action }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            list|latest|specific) ;;
            *) echo "action must be list, latest, or specific, got '$ACTION'."; exit 1 ;;
          esac
          if [ "$ACTION" = specific ] && [ -z "$COMMIT" ]; then
            echo "action 'specific' needs a commit."
            exit 1
          fi
          if [ "$ACTION" = list ]; then
            echo "deploying=false" >> "$GITHUB_OUTPUT"
            echo "This run lists candidates and deploys nothing."
          else
            echo "deploying=true" >> "$GITHUB_OUTPUT"
            echo "This run promotes $ACTION."
          fi

      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Production deploys run from main only, got $GITHUB_REF."
            exit 1
          }
          test -n "$AWS_REGION" || { echo "Missing AWS_REGION repository variable"; exit 1; }
          test -n "$AWS_PROD_DEPLOY_ROLE_ARN" || {
            echo "Missing AWS_PROD_DEPLOY_ROLE_ARN repository secret"
            exit 1
          }
          test -n "$AWS_ACCOUNT_ID" || {
            echo "Missing AWS_ACCOUNT_ID repository secret; it is required for log masking"
            exit 1
          }
          echo "::add-mask::$AWS_ACCOUNT_ID"

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_PROD_DEPLOY_ROLE_ARN }}
          role-session-name: portfolio-deploy-${{ github.run_id }}

      - name: Resolve and optionally list promotion candidates
        id: candidates
        env:
          ACTION: ${{ inputs.action }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin/promotion-candidates

          if [ "$ACTION" = list ]; then
            {
              cat "$RUNNER_TEMP/promotion-candidates.md"
              echo
              echo "Nothing was copied and nothing was deployed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve the source image in dev
        id: source
        if: steps.mode.outputs.deploying == 'true'
        env:
          ACTION: ${{ inputs.action }}
          INPUT_COMMIT: ${{ inputs.commit }}
          LATEST_COMMIT: ${{ steps.candidates.outputs.latest }}
          FUNCTION_EXISTS: ${{ steps.candidates.outputs.function_exists }}
          DEPLOYED_COMMIT: ${{ steps.candidates.outputs.deployed_commit }}
        run: |
          set -euo pipefail

          if [ "$ACTION" = latest ]; then
            target="$LATEST_COMMIT"
            [ -n "$target" ] || {
              echo "PROD already runs the newest proven build; nothing to promote."
              exit 1
            }
            echo "Resolved 'latest' to $target."
          else
            target="$INPUT_COMMIT"
          fi
          [[ "$target" =~ ^[0-9a-f]{7,40}$ ]] || {
            echo "Bad commit SHA '$target'; expected 7 to 40 lowercase hexadecimal characters."
            exit 1
          }
          commit=$(git rev-parse --verify --quiet "$target^{commit}") || {
            echo "No commit '$target' in this repository."
            exit 1
          }
          grep -Fxq "$commit" "$RUNNER_TEMP/successful-main-commits.txt" || {
            echo "$commit has no completed, successful main CI/CD run."
            echo "Failed and in-progress builds cannot be promoted."
            exit 1
          }
          git merge-base --is-ancestor "$commit" HEAD || {
            echo "$commit is not on main, so no main push built it."
            exit 1
          }
          grep -Fx "$commit" < <(git rev-list --first-parent HEAD) >/dev/null || {
            echo "$commit reached main through a merge and was never a tip of main."
            echo "Promote the merge commit that brought it in instead."
            exit 1
          }
          if [ "$FUNCTION_EXISTS" = true ]; then
            [ -n "$DEPLOYED_COMMIT" ] || {
              echo "Could not place what PROD runs in the first-parent history of main."
              echo "Refusing to promote without a direction check."
              exit 1
            }
            git merge-base --is-ancestor "$DEPLOYED_COMMIT" "$commit" || {
              echo "$(printf '%.7s' "$commit") is not ahead of PROD ($(printf '%.7s' "$DEPLOYED_COMMIT"))."
              echo "Promotion only moves production forward. Use Revert PROD to go back."
              exit 1
            }
          fi

          selector="imageTag=git-$commit"
          asked="tag git-$commit"
          echo "Resolving $asked in $DEV_ECR_REPOSITORY"

          if ! found=$(aws ecr describe-images \
                --repository-name "$DEV_ECR_REPOSITORY" \
                --image-ids "$selector" \
                --query 'imageDetails[0].{digest:imageDigest,tags:imageTags}' \
                --output json 2>"$RUNNER_TEMP/resolve-error.txt"); then
            sed -E 's/[0-9]{12}/<ACCOUNT>/g' "$RUNNER_TEMP/resolve-error.txt"
            grep -q ImageNotFound "$RUNNER_TEMP/resolve-error.txt" || exit 1
            echo
            echo "No image for $asked in $DEV_ECR_REPOSITORY."
            if ! git cat-file -e "$commit:.github/workflows/ci-cd.yml" 2>/dev/null; then
              echo "That commit predates this pipeline, so nothing built it."
            else
              echo "That build aged out of the retained dev-image window."
            fi
            echo "Images are not rebuilt during promotion because dependencies float."
            echo "Run this workflow with action 'list' to see what remains."
            exit 1
          fi

          digest=$(printf '%s' "$found" | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Invalid ECR digest: $digest"
            exit 1
          }

          tag="git-$commit"

          {
            echo "commit=$commit"
            echo "digest=$digest"
            echo "tag=$tag"
            echo "message=Promote to PROD - $ACTION $commit"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Promote to PROD::Promote to PROD - $ACTION $commit"
          echo "Resolved $tag to $digest"

      - name: Read the current production target
        id: current
        if: steps.mode.outputs.deploying == 'true'
        env:
          EXPECTED_FUNCTION_EXISTS: ${{ steps.candidates.outputs.function_exists }}
          EXPECTED_DIGEST: ${{ steps.candidates.outputs.deployed_digest }}
        run: |
          set -euo pipefail

          if ! aws lambda get-function \
              --function-name "$PROD_FUNCTION_NAME" \
              --qualifier live \
              --output json > "$RUNNER_TEMP/current-function.json" \
              2> "$RUNNER_TEMP/current-function-error.txt"; then
            sed -E 's/[0-9]{12}/<ACCOUNT>/g' "$RUNNER_TEMP/current-function-error.txt"
            grep -q ResourceNotFoundException "$RUNNER_TEMP/current-function-error.txt" || exit 1
            [ "$EXPECTED_FUNCTION_EXISTS" != true ] || {
              echo "The production function disappeared during this run; nothing was copied or deployed."
              exit 1
            }
            echo "$PROD_FUNCTION_NAME does not exist; this promotion bootstraps the repository."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_image=$(jq -r '.Code.ResolvedImageUri' "$RUNNER_TEMP/current-function.json")
          previous_digest="${previous_image##*@}"
          previous_version=$(jq -r '.Configuration.Version' "$RUNNER_TEMP/current-function.json")
          [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Production is not digest-pinned; found $previous_digest."
            exit 1
          }
          [[ "$previous_version" =~ ^[0-9]+$ ]] || {
            echo "The live alias did not resolve to a published version."
            exit 1
          }

          [ "$EXPECTED_FUNCTION_EXISTS" = true ] || {
            echo "The production function appeared during this run; refusing to overwrite it."
            exit 1
          }
          test "$previous_digest" = "$EXPECTED_DIGEST" || {
            echo "Production changed during this run: expected $EXPECTED_DIGEST, found $previous_digest."
            exit 1
          }
          # shellcheck disable=SC2016
          previous_tags=$(aws ecr describe-images \
            --repository-name "$PROD_ECR_REPOSITORY" \
            --image-ids "imageDigest=$previous_digest" \
            --query 'imageDetails[0].imageTags[?starts_with(@, `git-`)]' \
            --output text 2>/dev/null | tr '\t' ' ' || true)
          previous_commit=""
          while read -r sha; do
            case " $previous_tags " in
              *" git-$sha "*) previous_commit="$sha"; break ;;
            esac
          done < <(git rev-list --first-parent HEAD)
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "The running digest has no retained git-<sha> tag in production ECR."
            echo "A one-command rollback cannot be guaranteed, so nothing will be copied or deployed."
            exit 1
          }
          previous_tag="git-$previous_commit"

          {
            echo "exists=true"
            echo "image=$previous_image"
            echo "digest=$previous_digest"
            echo "version=$previous_version"
            echo "tag=$previous_tag"
            echo "commit=$previous_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Rollback target: $previous_tag at $previous_digest on Lambda version $previous_version"

      - name: Copy the validated image into production
        id: copy
        if: steps.mode.outputs.deploying == 'true'
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          TAG: ${{ steps.source.outputs.tag }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/registry-auth.json
        run: |
          set -euo pipefail
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          destination="$registry/$PROD_ECR_REPOSITORY@$SOURCE_DIGEST"

          existing=$(aws ecr batch-get-image \
            --repository-name "$PROD_ECR_REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --output json)
          destination_digest=$(printf '%s' "$existing" \
            | jq -r '.images[0].imageId.imageDigest // empty')
          if [ -n "$destination_digest" ]; then
            test "$destination_digest" = "$SOURCE_DIGEST" || {
              echo "$TAG already names $destination_digest, not $SOURCE_DIGEST."
              exit 1
            }
            echo "$TAG already exists at the requested digest; copy is idempotently complete."
            copied=false
          else
            failure=$(printf '%s' "$existing" \
              | jq -r '.failures[0].failureCode // empty')
            test "$failure" = ImageNotFound || {
              echo "Could not resolve production tag: ${failure:-unknown error}"
              exit 1
            }
            aws ecr get-login-password --region "$AWS_REGION" \
              | skopeo login --username AWS --password-stdin "$registry"
            skopeo copy --preserve-digests \
              "docker://$registry/$DEV_ECR_REPOSITORY@$SOURCE_DIGEST" \
              "docker://$registry/$PROD_ECR_REPOSITORY:$TAG"
            copied=true
          fi

          {
            echo "copied=$copied"
            echo "uri=$destination"
          } >> "$GITHUB_OUTPUT"

      - name: Assert production holds the same bytes
        if: steps.mode.outputs.deploying == 'true'
        env:
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          destination_digest=$(aws ecr batch-get-image \
            --repository-name "$PROD_ECR_REPOSITORY" \
            --image-ids "imageTag=$TAG" \
            --query 'images[0].imageId.imageDigest' \
            --output text)
          test "$destination_digest" = "$SOURCE_DIGEST" || {
            echo "Digest changed in copy: dev $SOURCE_DIGEST, prod $destination_digest."
            echo "Production Lambda was not touched."
            exit 1
          }
          echo "Production copy matches $destination_digest"

      - name: Deploy the selected digest when production Lambda exists
        id: deploy
        if: steps.mode.outputs.deploying == 'true'
        env:
          FUNCTION_EXISTS: ${{ steps.current.outputs.exists }}
          PREVIOUS_DIGEST: ${{ steps.current.outputs.digest }}
          PREVIOUS_VERSION: ${{ steps.current.outputs.version }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          TAG: ${{ steps.source.outputs.tag }}
          IMAGE_URI: ${{ steps.copy.outputs.uri }}
        run: |
          set -euo pipefail

          if [ "$FUNCTION_EXISTS" != true ]; then
            {
              echo "bootstrapped=true"
              echo "changed=false"
              echo "verified=true"
            } >> "$GITHUB_OUTPUT"
            echo "Production ECR is seeded; the production function does not exist yet."
            exit 0
          fi

          aws lambda get-function \
            --function-name "$PROD_FUNCTION_NAME" \
            --qualifier live \
            --output json > "$RUNNER_TEMP/predeploy-function.json"
          live_image=$(jq -r '.Code.ResolvedImageUri' "$RUNNER_TEMP/predeploy-function.json")
          live_digest="${live_image##*@}"
          live_version=$(jq -r '.Configuration.Version' "$RUNNER_TEMP/predeploy-function.json")
          test "$live_digest" = "$PREVIOUS_DIGEST" || {
            echo "Production changed before deployment: expected $PREVIOUS_DIGEST, found $live_digest."
            exit 1
          }
          test "$live_version" = "$PREVIOUS_VERSION" || {
            echo "Production version changed before deployment: expected $PREVIOUS_VERSION, found $live_version."
            exit 1
          }

          if [ "$PREVIOUS_DIGEST" = "$SOURCE_DIGEST" ]; then
            {
              echo "bootstrapped=false"
              echo "changed=false"
              echo "verified=true"
              echo "version=$PREVIOUS_VERSION"
            } >> "$GITHUB_OUTPUT"
            echo "$PROD_FUNCTION_NAME live already runs $SOURCE_DIGEST"
            exit 0
          fi

          aws lambda update-function-code \
            --function-name "$PROD_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" >/dev/null
          aws lambda wait function-updated-v2 \
            --function-name "$PROD_FUNCTION_NAME"

          version=$(aws lambda publish-version \
            --function-name "$PROD_FUNCTION_NAME" \
            --description "${TAG#git-}" \
            --query Version \
            --output text)
          aws lambda update-alias \
            --function-name "$PROD_FUNCTION_NAME" \
            --name live \
            --function-version "$version" >/dev/null

          deployed_uri=$(aws lambda get-function \
            --function-name "$PROD_FUNCTION_NAME" \
            --qualifier live \
            --query 'Code.ResolvedImageUri' \
            --output text)
          test "$deployed_uri" = "$IMAGE_URI" || {
            echo "Production live resolved to $deployed_uri, not $IMAGE_URI."
            exit 1
          }

          {
            echo "bootstrapped=false"
            echo "changed=true"
            echo "verified=true"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "$PROD_FUNCTION_NAME live now runs $SOURCE_DIGEST on version $version"

      - name: Write job summary
        if: always() && steps.mode.outputs.deploying == 'true' && steps.source.outcome == 'success' && steps.current.outcome == 'success'
        env:
          JOB_STATUS: ${{ job.status }}
          REQUEST_MESSAGE: ${{ steps.source.outputs.message }}
          SOURCE_DIGEST: ${{ steps.source.outputs.digest }}
          TAG: ${{ steps.source.outputs.tag }}
          FUNCTION_EXISTS: ${{ steps.current.outputs.exists }}
          PREVIOUS_DIGEST: ${{ steps.current.outputs.digest }}
          PREVIOUS_TAG: ${{ steps.current.outputs.tag }}
          PREVIOUS_COMMIT: ${{ steps.current.outputs.commit }}
          PREVIOUS_VERSION: ${{ steps.current.outputs.version }}
          DEPLOY_CHANGED: ${{ steps.deploy.outputs.changed }}
          DEPLOY_VERIFIED: ${{ steps.deploy.outputs.verified }}
          DEPLOY_VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          set -u
          current_digest=""
          current_version=""
          if [ "$FUNCTION_EXISTS" = true ]; then
            current_image=$(aws lambda get-function \
              --function-name "$PROD_FUNCTION_NAME" \
              --qualifier live \
              --query 'Code.ResolvedImageUri' \
              --output text 2>/dev/null || true)
            current_digest="${current_image##*@}"
            current_version=$(aws lambda get-alias \
              --function-name "$PROD_FUNCTION_NAME" \
              --name live \
              --query FunctionVersion \
              --output text 2>/dev/null || true)
          fi

          {
            echo "## $REQUEST_MESSAGE"
            echo "- Source: $DEV_ECR_REPOSITORY@$SOURCE_DIGEST as $TAG"
            if [ "$FUNCTION_EXISTS" != true ]; then
              echo "- Previous: no production Lambda function."
              if [ "$JOB_STATUS" = success ]; then
                echo "- New: $PROD_ECR_REPOSITORY@$SOURCE_DIGEST is seeded; the production Lambda does not exist."
              else
                echo "- Failed while seeding production ECR; no function was touched."
              fi
            else
              echo "- Previous: $PREVIOUS_TAG at $PREVIOUS_DIGEST, Lambda version $PREVIOUS_VERSION."
              if [[ "$current_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "- Now: $current_digest, Lambda version $current_version."
              else
                echo "- Now: readback failed; inspect production Lambda before retrying."
              fi
              if [ "$JOB_STATUS" = success ] && [ "$DEPLOY_CHANGED" = true ] \
                  && [ "$DEPLOY_VERIFIED" = true ]; then
                echo "- Outcome: Promoted to PROD - ${REQUEST_MESSAGE#Promote to PROD - }."
                echo "- Deployment succeeded and readback matched version $DEPLOY_VERSION."
              elif [ "$JOB_STATUS" = success ]; then
                echo "- Deployment was already current; no alias update was needed."
              else
                echo "- Promotion failed. Alias live should still reference the previous published version; verify it before retrying."
              fi
              echo "- Roll back: gh workflow run revert-production.yml --ref main -f action=specific -f commit=$PREVIOUS_COMMIT"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
